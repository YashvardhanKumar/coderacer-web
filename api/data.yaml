- fields:
    created_at: 2025-12-26 12:19:52.698840+00:00
    difficulty: EASY
    name: Two Sum
    problem_description: "<p>Given an array of integers&nbsp;<code>nums</code>&nbsp;and\
      \ an integer&nbsp;<code>target</code>, return&nbsp;<em>indices of the two numbers\
      \ such that they add up to&nbsp;<code>target</code></em>.</p>\r\n\r\n<p>You\
      \ may assume that each input would have&nbsp;<strong><em>exactly</em>&nbsp;one\
      \ solution</strong>, and you may not use the&nbsp;<em>same</em>&nbsp;element\
      \ twice.</p>\r\n\r\n<p>You can return the answer in any order.</p>\r\n\r\n<p>&nbsp;</p>\r\
      \n\r\n<p><strong>Example 1:</strong></p>\r\n\r\n<pre>\r\n<strong>Input:</strong>\
      \ nums = [2,7,11,15], target = 9\r\n<strong>Output:</strong> [0,1]\r\n<strong>Explanation:</strong>\
